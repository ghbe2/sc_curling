<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>キャラ画像テスト</title>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; padding:0; background:#fdeef4; color:#4a2133;
    font-family:'DotGothic16', system-ui, sans-serif; }
  h2 { margin:14px 10px 6px; font-size:14px; color:#e91e63; }
  p.note { margin:0 10px 8px; font-size:11px; line-height:1.55; opacity:.85; }
  canvas { display:block; margin:0 auto; background:#fce4ec; border-radius:10px; }
  .panel { margin:0 8px 14px; }
  .ctrl { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin:0 10px 10px; font-size:11px; }
  .ctrl label { display:flex; align-items:center; gap:4px; }
  .val { color:#e91e63; font-weight:700; min-width:44px; display:inline-block; }
</style>
</head>
<body>

<h2>① 狙うときのガイド案（本題）</h2>
<p class="note">
  同じ配置を4通りで並べています。当たり判定の円は全キャラ共通で、絵だけが円の外へ大きくはみ出します。
  「絵が重なって見えるのに、判定は当たっていない」が起きるのが今回の懸念です。
  <b>アルバ（たてがみ）とエノ（角）が最悪ケース</b>なので、その2体を混ぜてあります。
</p>
<div class="ctrl">
  <label><input id="anim" type="checkbox"> 回転させる</label>
  <label>絵の大きさ <input id="ratio" type="range" min="0.45" max="0.95" step="0.005" value="0.625">
    <span class="val" id="ratioV">0.625</span></label>
</div>
<div class="panel"><canvas id="cGuide" width="750" height="1180"></canvas></div>

<h2>② 全キャラ（実寸）</h2>
<p class="note">盤の上に置いたときの実際の大きさです。赤い破線が当たり判定。</p>
<div class="panel"><canvas id="cAll" width="750" height="900"></canvas></div>

<h2>③ 5状態の確認（拡大）</h2>
<div class="ctrl">
  <label>キャラ <select id="who"></select></label>
</div>
<div class="panel"><canvas id="cStates" width="1100" height="300"></canvas></div>

<script>
"use strict";

const PIECE_RADIUS = 36, VIEW_SCALE = 0.5391;
const SCREEN_R = PIECE_RADIUS * VIEW_SCALE;      // 実機での半径 19.4px
const SPIN_RPS = 0.5;
let CIRCLE_RATIO = 0.625;                         // 256px画像に半径80pxの円

const ALLIES  = ["01","02","03","04","05","06","07","08","09","10","11","12"];
const ENEMIES = ["23","24","25","26","27","28","29"];
const NAMES = { "01":"ミナリ","02":"ベルペット","03":"ラコ","04":"バーニ","05":"リウ","06":"アウネ",
  "07":"ヒロイベオ","08":"ぱふ","09":"マユゥ","10":"ユゥナリナ","11":"モコクン","12":"瑞珠",
  "23":"アルバ","24":"ジーナ","25":"デロルス","26":"ウーヨン","27":"ウェンカ","28":"マルガリティフェラ","29":"エノ" };

const images = {};
function load(name) {
  if (images[name]) return images[name];
  const img = new Image();
  img.src = `images/characters/${name}.png`;
  images[name] = img;
  return img;
}
for (const a of ALLIES) for (const s of ["normal","excited","hit","spin_clockwise","spin_counterclockwise"]) load(`${a}_${s}`);
load("07_spin_clockwise_b"); load("07_spin_counterclockwise_b");
for (const e of ENEMIES) load(`${e}_normal`);
load("24_normal_b"); load("27_normal_b");

function drawChar(g, name, x, y, r, rot = 0) {
  const img = images[name];
  if (!img || !img.complete || !img.naturalWidth) return;
  const size = (r * 2) / CIRCLE_RATIO;
  g.save(); g.translate(x, y); g.rotate(rot);
  g.drawImage(img, -size/2, -size/2, size, size);
  g.restore();
}
function ring(g, x, y, r, color, w = 1.5, dash = null) {
  g.save(); if (dash) g.setLineDash(dash);
  g.beginPath(); g.arc(x, y, r, 0, Math.PI*2);
  g.strokeStyle = color; g.lineWidth = w; g.stroke(); g.restore();
}
function label(g, t, x, y, size = 12, color = "#4a2133") {
  g.fillStyle = color; g.font = `700 ${size}px 'DotGothic16',sans-serif`;
  g.textAlign = "center"; g.textBaseline = "middle"; g.fillText(t, x, y);
}
function house(g, x, y, r) {
  for (const [rad, col] of [[r,"#8f78bd"],[r*0.66,"#fff"],[r*0.33,"#ef8aad"],[r*0.1,"#fff"]]) {
    g.beginPath(); g.arc(x, y, rad, 0, Math.PI*2); g.fillStyle = col; g.fill();
  }
}

// ---- ① ガイド案 -----------------------------------------------------------
// わざと「絵は重なるが判定は当たっていない」配置にする
const SCENE = [
  { n:"23_normal", dx:-64, dy:-26 },   // アルバ:たてがみが大きい
  { n:"29_normal", dx:  0, dy:-52 },   // エノ:角が長い
  { n:"01_normal", dx: 58, dy:-14 },
  { n:"11_normal", dx:-24, dy: 42 },   // モコクン:耳が大きい
  { n:"02_normal", dx: 44, dy: 52 },
];
const STYLES = [
  { key:"none",  title:"案0：ガイドなし（いまの案）" },
  { key:"ring",  title:"案1：判定の円を細い輪で出す" },
  { key:"disc",  title:"案2：円の内側をうっすら白く敷く" },
  { key:"dim",   title:"案3：円の外にはみ出した絵を薄くする" },
];

function drawGuideScene(g, style, cx, cy, rot) {
  house(g, cx, cy, 124);
  for (const s of SCENE) {
    const x = cx + s.dx, y = cy + s.dy;
    if (style === "disc") {
      g.beginPath(); g.arc(x, y, SCREEN_R, 0, Math.PI*2);
      g.fillStyle = "rgba(255,255,255,0.72)"; g.fill();
    }
    if (style === "dim") {
      // 円の外は薄く、内側はそのまま:2回描いて円でクリップする
      g.save(); g.globalAlpha = 0.3; drawChar(g, s.n, x, y, SCREEN_R, rot); g.restore();
      g.save();
      g.beginPath(); g.arc(x, y, SCREEN_R, 0, Math.PI*2); g.clip();
      drawChar(g, s.n, x, y, SCREEN_R, rot);
      g.restore();
    } else {
      drawChar(g, s.n, x, y, SCREEN_R, rot);
    }
    if (style === "ring") ring(g, x, y, SCREEN_R, "rgba(233,30,99,0.9)", 1.5);
  }
}

// ---- 描画ループ ------------------------------------------------------------
const t0 = performance.now();
function tick(now) {
  const sec = (now - t0) / 1000;
  const rot = document.getElementById("anim").checked ? sec * SPIN_RPS * Math.PI * 2 : 0;

  // ①
  {
    const c = document.getElementById("cGuide"), g = c.getContext("2d");
    const dpr = 2; if (c.width !== 750) c.width = 750;
    g.setTransform(dpr,0,0,dpr,0,0);
    const W = c.width/dpr;
    g.clearRect(0,0,W,c.height/dpr);
    STYLES.forEach((st, i) => {
      const cy = 110 + i * 145;
      drawGuideScene(g, st.key, W/2, cy, rot);
      label(g, st.title, W/2, cy + 92, 12, "#e91e63");
    });
  }
  // ②
  {
    const c = document.getElementById("cAll"), g = c.getContext("2d");
    const dpr = 2; if (c.width !== 750) c.width = 750;
    g.setTransform(dpr,0,0,dpr,0,0);
    const W = c.width/dpr; g.clearRect(0,0,W,c.height/dpr);
    const list = [...ALLIES.map(a=>[`${a}_normal`, NAMES[a]]),
                  ...ENEMIES.map(e=>[`${e}_normal`, NAMES[e]]),
                  ["24_normal_b","マミ"], ["27_normal_b","ムイ"], ["07_spin_clockwise_b","ヒロイベオ進化"]];
    const cols = 5, cw = W/cols, ch = 72;
    list.forEach(([n, jp], i) => {
      const x = cw*(i%cols) + cw/2, y = 44 + Math.floor(i/cols)*ch;
      drawChar(g, n, x, y, SCREEN_R, rot);
      ring(g, x, y, SCREEN_R, "rgba(220,30,60,.75)", 1, [3,3]);
      label(g, jp, x, y + 34, 9, "#8a6474");
    });
  }
  // ③
  {
    const c = document.getElementById("cStates"), g = c.getContext("2d");
    g.clearRect(0,0,c.width,c.height);
    const who = document.getElementById("who").value || "01";
    const states = ["normal","excited","hit","spin_clockwise","spin_counterclockwise"];
    const step = c.width/states.length, r = 58;
    states.forEach((s, i) => {
      const x = step*(i+0.5);
      drawChar(g, `${who}_${s}`, x, 120, r, rot);
      ring(g, x, 120, r, "rgba(220,30,60,.8)", 2);
      label(g, s, x, 240, 12);
    });
  }
  requestAnimationFrame(tick);
}

const sel = document.getElementById("who");
for (const a of ALLIES) { const o = document.createElement("option"); o.value = a; o.textContent = `${a} ${NAMES[a]}`; sel.appendChild(o); }
document.getElementById("ratio").addEventListener("input", (e) => {
  CIRCLE_RATIO = parseFloat(e.target.value);
  document.getElementById("ratioV").textContent = CIRCLE_RATIO.toFixed(3);
});
requestAnimationFrame(tick);
</script>
</body>
</html>
